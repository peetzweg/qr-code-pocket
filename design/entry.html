<figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="width:330px;height:690px;border-radius:44px;overflow:hidden;background:#f3f1ec;box-shadow:0 0 0 10px #111, 0 20px 50px -20px rgba(0,0,0,.5);position:relative;font-family:-apple-system,system-ui,'Hiragino Sans',sans-serif">
<div style="height:44px;display:flex;justify-content:center;align-items:center"><div style="width:110px;height:30px;border-radius:20px;background:#111"></div></div>
<div style="padding:6px 16px;font:14px/1.5 system-ui;color:#1c1c1a">
    <div style="font:700 17px system-ui;margin:6px 0 10px">Less typing</div>
    <ul style="margin:0;padding-left:18px;color:#55524b;display:flex;flex-direction:column;gap:8px">
      <li>The ticket is drawn first, from what was read. Fields underneath show only what was found, as tap-to-fix values rather than empty inputs.</li>
      <li>Every value says where it came from: <b>code</b> (exact, from the payload) or <b>screenshot</b> (read by OCR, worth a glance).</li>
      <li>The category is preselected from the issuer or payload, and the title is built for you: “Nozomi 23”, “NH 241”, “teamLab Planets”.</li>
      <li>One tap on <b>Add</b> in the common case. Several screenshots go through one after another; the same booking merges.</li>
    </ul>
    <div style="font:700 17px system-ui;margin:20px 0 8px">Read from the code alone</div>
    <div class="mono" style="font-size:11.5px;line-height:1.6;color:#55524b">
      Boarding pass → passenger, flight, route, date, seat, PNR<br>
      Klook / KKday link → issuer, order no., visit date<br>
      TableCheck / OMAKASE → restaurant booking, ref<br>
      Smart EX / Eki-net / e5489 → train<br>
      Calendar event → title, place, start<br>
      Wi-Fi, contact, location, order numbers
