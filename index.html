<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QR Wallet" />
    <meta name="application-name" content="QR Code Wallet" />

    <!-- Search and sharing. %SITE_URL% is the deployed origin, filled in at build (vite.config.ts). -->
    <title>QR Code Wallet · Tickets, passes and QR codes in one place</title>
    <meta name="description" content="Keep the QR codes you collect while travelling in one wallet: train tickets, museum entries, restaurant bookings. Add a screenshot or PDF; it's read on your phone. Local-first, works offline, no account." />
    <meta name="keywords" content="QR code wallet, save QR codes, ticket wallet, QR code app, travel tickets, local-first, offline, PWA" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QR Code Wallet" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="QR Code Wallet" />
    <meta property="og:description" content="Every code in one place. Add the screenshot or PDF; it's read on your phone and printed in your style." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QR Code Wallet: a train ticket, Nozomi 23 from Tokyo to Kyoto at 10:03, its QR code drawn with rounded modules inside a dashed crop frame." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QR Code Wallet" />
    <meta name="twitter:description" content="Every code in one place. Read on your phone, printed in your style. Local-first, works offline." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="A train ticket in QR Code Wallet with its QR code drawn with rounded modules." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QR Code Wallet",
        "url": "%SITE_URL%/",
        "description": "A local-first wallet for the QR codes you collect while travelling. Codes are read on the device; nothing is uploaded and there is no account.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any modern browser; installable on iOS, Android and desktop",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "%SITE_URL%/og.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
